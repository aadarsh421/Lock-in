<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Test</title>
</head>

<body style="text-align:center;padding:40px">

<h1>🔊 Voice Test</h1>

<button
  onclick="testVoice()"
  style="font-size:24px;padding:25px;width:100%">
  TAP TO SPEAK
</button>

<script>
function testVoice() {

  alert("Button works");

  var synth = window.speechSynthesis;

  if (!synth) {
    alert("speechSynthesis is NOT available");
    return;
  }

  var voices = synth.getVoices();

  if (!voices.length) {
    alert("No voices loaded yet. Tap the button again.");
    return;
  }

  var utterance =
    new SpeechSynthesisUtterance(
      "Mat kar masturbation, madarchod. Ten minute ruk."
    );

  utterance.volume = 1;
  utterance.rate = 0.9;
  utterance.pitch = 1;

  synth.cancel();
  synth.speak(utterance);

  if (navigator.vibrate) {
    navigator.vibrate([500,150,500,150,1000]);
  }
}
</script>

</body>
</html>
